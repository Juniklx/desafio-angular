<div class="app-shell">
  <input type="checkbox" id="menu-toggle" class="menu-toggle-input visually-hidden" aria-label="Abrir menu" />

  <aside class="sidebar">
    <div class="sidebar-marca">
      <img src="ford.png" alt="Ford" />
      <span>Painel de Frota</span>
    </div>
    <nav class="sidebar-nav" aria-label="Navegação principal">
      <a routerLink="/home" class="sidebar-link" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 11.5 12 4l8 7.5" />
          <path d="M6 10v9a1 1 0 0 0 1 1h3.5v-5h3v5H17a1 1 0 0 0 1-1v-9" />
        </svg>
        Home
      </a>
      <a routerLink="/dashboard" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="7" height="7" rx="1.5" />
          <rect x="13" y="4" width="7" height="7" rx="1.5" />
          <rect x="4" y="13" width="7" height="7" rx="1.5" />
          <rect x="13" y="13" width="7" height="7" rx="1.5" />
        </svg>
        Dashboard
      </a>
    </nav>
    <a routerLink="/login" class="sidebar-link sidebar-link--sair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3" />
        <path d="M15 8l4 4-4 4" />
        <path d="M19 12H9" />
      </svg>
      Sair
    </a>
  </aside>

  <label for="menu-toggle" class="menu-overlay" aria-hidden="true"></label>

  <div class="area-principal">
    <header class="topo">
      <label for="menu-toggle" class="botao-hamburguer" aria-label="Abrir menu">
        <span class="botao-hamburguer-barra"></span>
        <span class="botao-hamburguer-barra"></span>
        <span class="botao-hamburguer-barra"></span>
      </label>
      <span class="topo-titulo">Home</span>
    </header>

    <main class="home-hero">
      <img class="home-hero-imagem" src="ranger.png" alt="Ford Ranger" />
      <div class="home-hero-overlay" aria-hidden="true"></div>
      <div class="home-hero-cartao">
        <h1>Seja bem-vindo(a)!</h1>
        <p>Acompanhe vendas, conectividade e atualizações de software de toda a frota em um único painel.</p>
        <a routerLink="/dashboard" class="btn btn-primario">Ir para o Dashboard</a>
      </div>
    </main>
  </div>
</div>
