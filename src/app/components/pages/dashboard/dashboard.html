<div class="app-shell">
  <main class="dashboard-conteudo">
    <section class="cartao dashboard-selecao">
      <div class="campo">
        <label for="modelo-veiculo">Modelo do veículo</label>
        <app-campo-icone>
          <app-icone campo-icone-svg nome="carro"/>
          <select campo-icone-input id="modelo-veiculo" name="modelo-veiculo"
            (change)="aoTrocarModelo($any($event.target).value)">
            <option *ngFor="let v of veiculos()" [value]="v.id">
              {{ v.vehicle }}
            </option>
          </select>
        </app-campo-icone>
      </div>
    </section>

    <section class="metricas" aria-label="Métricas da frota">
      <app-metrica-cartao rotulo="Total de vendas" [valor]="modeloSelecionado()?.volumetotal ?? 0" />
      <app-metrica-cartao rotulo="Conectados" [valor]="modeloSelecionado()?.connected ?? 0" />
      <app-metrica-cartao rotulo="Update de software" [valor]="modeloSelecionado()?.softwareUpdates ?? 0" />
    </section>

    <section class="cartao dashboard-vitrine">
      <img [src]="modeloSelecionado()?.img" [alt]="modeloSelecionado()?.vehicle" class="dashboard-vitrine-imagem" />
    </section>

    <section class="cartao dashboard-tabela">
      <div class="dashboard-tabela-cabecalho">
        <h2>Telemetria por veículo</h2>
        <app-campo-icone variante="campo-input--busca">
          <app-icone campo-icone-svg nome="busca"/>
          <input campo-icone-input type="search" name="busca-vin" placeholder="Buscar por código (VIN)"
            aria-label="Buscar por código do veículo" (input)="aoDigitarBusca($event)" />
        </app-campo-icone>
      </div>

      <div class="tabela-wrapper">
        <table class="tabela-frota">
          <thead>
            <tr>
              <th scope="col">Código (VIN)</th>
              <th scope="col">Odômetro</th>
              <th scope="col">Nível de combustível</th>
              <th scope="col">Status</th>
              <th scope="col">Lat.</th>
              <th scope="col">Long.</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="resultadoBusca() as dado">
              <td>{{ vinBuscado() }}</td>
              <td>{{ dado.odometro }} km</td>
              <td>{{ dado.nivelCombustivel }}%</td>
              <td>
                <span class="status-pill" [class.status-pill--online]="dado.status === 'on'">
                  {{ dado.status }}
                </span>
              </td>
              <td>{{ dado.lat }}</td>
              <td>{{ dado.long }}</td>
            </tr>
            <tr *ngIf="buscaSemResultado()">
              <td colspan="6">Nenhum veículo encontrado com esse código.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
