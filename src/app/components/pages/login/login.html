<div class="login-tela">
  <section class="login-visual" aria-hidden="true">
    <div class="login-visual-foto">
      <img src="img/ranger.png" alt="Ford Ranger" />
    </div>
  </section>

  <section class="login-painel">
    <div class="login-caixa">
      <div class="login-badge">Acesso restrito</div>

      <div class="login-marca">
        <img src="img/ford.png" alt="Ford" />
      </div>

      <h1>Boas-vindas</h1>
      <p>Entre com suas credenciais para acessar o painel.</p>

      <form class="login-formulario" (ngSubmit)="login()">
        <div class="campo">
          <label for="nome" class="visually-hidden">Usuário</label>
          <app-campo-icone>
            <app-icone campo-icone-svg nome="usuario" />
            <input campo-icone-input type="text" id="nome" [(ngModel)]="usuario.nome" name="nome"
              placeholder="Digite seu usuário" autocomplete="username" required />
          </app-campo-icone>
        </div>

        <div class="campo">
          <label for="senha" class="visually-hidden">Senha</label>
          <app-campo-icone>
            <app-icone campo-icone-svg nome="senha" />
            <input campo-icone-input type="password" id="senha" [(ngModel)]="usuario.senha" name="senha"
              placeholder="Digite sua senha" autocomplete="current-password" required />
          </app-campo-icone>
        </div>
        <p class="login-erro" role="alert" *ngIf="erroLogin()">{{ erroLogin() }}</p>
        <button type="submit" class="btn btn-primario">Entrar</button>
      </form>
    </div>
  </section>
</div>
