<input type="checkbox" id="menu-toggle" #menuToggle class="menu-toggle-input visually-hidden" aria-label="Abrir menu" />
<aside class="sidebar">
  <div class="sidebar-marca">
    <img src="img/ford.png" alt="Ford" />
  </div>
  <label for="menu-toggle" class="sidebar-fechar" aria-label="Fechar menu">
    <app-icone nome="fechar" />
  </label>
  <a routerLink="/home" class="sidebar-link" (click)="menuToggle.checked = false">
    Home
  </a>
  <a routerLink="/dashboard" class="sidebar-link" (click)="menuToggle.checked = false">
    Dashboard
  </a>
  <a (click)="sair()" class="sidebar-link sidebar-link--sair">
    Sair
  </a>
</aside>

<label for="menu-toggle" class="menu-overlay" aria-hidden="true"></label>
